name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build --wait
      - run: docker compose exec -T api npm run migrate
      - run: docker compose exec -T api npm run typecheck
      - run: docker compose exec -T api npm run test:integration
      - run: docker compose exec -T api npm audit --omit=dev --audit-level=high
      - if: always()
        run: docker compose down -v
